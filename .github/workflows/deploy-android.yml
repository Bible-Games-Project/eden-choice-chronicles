name: Deploy Android

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        required: false
        default: 'main'
      track:
        description: 'Play Store track'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    branches:
      - main
      - deploy-app

jobs:
  deploy:
    uses: Bible-Games-Project/bgp-admin/.github/workflows/deploy-android.yml@main
    with:
      package-name: "com.biblegames.eden"
      play-track: ${{ inputs.track || 'internal' }}
      java-version: "21"
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  tag:
    needs: [deploy]
    if: success()
    uses: Bible-Games-Project/bgp-admin/.github/workflows/tag-release.yml@main
