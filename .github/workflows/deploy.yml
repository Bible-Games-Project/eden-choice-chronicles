name: Deploy App

permissions:
  contents: write  # Required for tag creation

on:
  workflow_dispatch:
    inputs:
      deploy_ios:
        description: "Deploy iOS"
        required: false
        type: boolean
        default: false
      deploy_android:
        description: "Deploy Android"
        required: false
        type: boolean
        default: false
      skip_android_upload:
        description: "Skip Android Google Play upload (only generate AAB)"
        required: false
        type: boolean
        default: false
      marketing_version:
        description: "Marketing version (e.g., 1.0, 2.1). If empty, uses package.json"
        required: false
        type: string
        default: ""

jobs:
  # =========================
  #   Optimize Images
  # =========================
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Run image optimization
        run: |
          chmod +x ./optimize-images.sh
          ./optimize-images.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No image optimization needed"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📸 Images optimized, committing changes..."
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: auto-optimize images to WebP format [skip ci]

          - Converted PNG to WebP where needed
          - Updated code references automatically
          - Optimized by CI pipeline before deployment"
          git push

  # =========================
  #   iOS
  # =========================
  ios:
    needs: optimize-images
    if: inputs.deploy_ios == true || inputs.deploy_ios == 'true'
    uses: Bible-Games-Project/bgp-admin/.github/workflows/deploy-ios.yml@main
    with:
      xcode-version: "16.2"
      runner: macos-15
      team-id: "N65TK8GHAL"
      marketing-version: ${{ inputs.marketing_version }}
    secrets:
      IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_EXPORT_OPTIONS_PLIST: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

  # =========================
  #   Android
  # =========================
  android:
    needs: optimize-images
    if: inputs.deploy_android == true || inputs.deploy_android == 'true'
    uses: Bible-Games-Project/bgp-admin/.github/workflows/deploy-android.yml@main
    with:
      package-name: com.biblegames.eden
      play-track: internal
      skip-upload: ${{ inputs.skip_android_upload }}
      marketing-version: ${{ inputs.marketing_version }}
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  # =========================
  #   Tag
  # =========================
  # notify:
  #   needs: [ios, android]
  #   if: always() && (needs.ios.result == 'success' || needs.android.result == 'success')
  #   uses: Bible-Games-Project/bgp-admin/.github/workflows/notify-telegram.yml@main
  #   with:
  #     app-name: "Eden Choice Chronicles"
  #     platforms: "iOS + Android"
  #   secrets:
  #     TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  #     TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  tag:
    needs: [ios, android]
    if: always() && (needs.ios.result == 'success' || needs.android.result == 'success')
    uses: Bible-Games-Project/bgp-admin/.github/workflows/tag-release.yml@main
